CONFIG_GPIO=y

# Make sure printk is not printing to the UART console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# CONFIG_SERIAL=n
# CONFIG_CONSOLE=n
# CONFIG_UART_CONSOLE=n
# CONFIG_UART_INTERRUPT_DRIVEN=n

# separated into prj_xiao.conf and prj.conf
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_MODE_MINIMAL=n
# CONFIG_LOG=n
# CONFIG_LOG_BACKEND_UART=n
# CONFIG_LOG_MODE_IMMEDIATE=n
# CONFIG_LOG_RUNTIME_FILTERING=n
# CONFIG_LOG_MODE_MINIMAL=n


CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7

CONFIG_EVENTS=y

CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y

CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y
CONFIG_ZIGBEE_CHANNEL_MASK=0x07FFF800

# Enable DK LED and Buttons library
# CONFIG_DK_LIBRARY=y

# This example requires more workqueue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Enable SWD Debug
# CONFIG_DEBUG=y
# CONFIG_NO_OPTIMIZATIONS=y
# CONFIG_ASSERT=y
# CONFIG_ASSERT_VERBOSE=y
# CONFIG_DEBUG_THREAD_INFO=y

# Power config
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y
CONFIG_HWINFO=y
CONFIG_CRC=y
CONFIG_WATCHDOG=y

# NVS
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y

# TIME
CONFIG_NEWLIB_LIBC=y
CONFIG_POSIX_API=y

# ADC
CONFIG_ADC=y

# MCUBOOT
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# FOTA
CONFIG_ZIGBEE_FOTA=y
CONFIG_ZIGBEE_FOTA_PROGRESS_EVT=y
CONFIG_ENABLE_ZIGBEE_FOTA_MAX_HW_VERSION=y
CONFIG_ENABLE_ZIGBEE_FOTA_MIN_HW_VERSION=y
CONFIG_ZIGBEE_FOTA_MIN_HW_VERSION=0x0001
CONFIG_ZIGBEE_FOTA_MAX_HW_VERSION=0x0001